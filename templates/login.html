{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="form-container">

    <h2>
        Customer Login
    </h2>

    <p class="form-subtitle">
        Login to access your banking dashboard.
    </p>


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            class="btn full"
        >
            Login
        </button>

    </form>

    <div>
        <a href="{{ url_for("forgot_password") }}" >Forgot Password</a>
    </div>


    <p class="form-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </p>

</div>

{% endblock %}
