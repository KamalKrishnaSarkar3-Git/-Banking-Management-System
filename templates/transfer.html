{% extends "base.html" %}

{% block title %}
Transfer
{% endblock %}


{% block content %}

<div class="form-container">

    <h2>
        🔄 Transfer Funds
    </h2>

    <p class="form-subtitle">
        Transfer demo funds to another SecureBank account.
    </p>


    <form
        method="POST"
        action="{{ url_for('transfer') }}"
    >

        <label>
            Receiver Account Number
        </label>

        <input
            type="text"
            name="receiver_account"
            placeholder="Enter account number"
            required
        >


        <label>
            Amount
        </label>

        <input
            type="number"
            name="amount"
            min="0.01"
            step="0.01"
            placeholder="Enter amount"
            required
        >


        <button
            type="submit"
            class="btn full"
        >
            Transfer
        </button>

    </form>

</div>

{% endblock %}
