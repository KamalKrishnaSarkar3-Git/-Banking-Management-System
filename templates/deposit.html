{% extends "base.html" %}

{% block title %}
Deposit
{% endblock %}


{% block content %}

<div class="form-container">

    <h2>
        💰 Deposit Funds
    </h2>

    <p class="form-subtitle">
        Add demo funds to your account.
    </p>


    <form
        method="POST"
        action="{{ url_for('deposit') }}"
    >

        <label>
            Amount
        </label>

        <input
            type="number"
            name="amount"
            min="0.01"
            step="0.01"
            placeholder="Enter amount"
            required
        >


        <button
            type="submit"
            class="btn full"
        >
            Deposit
        </button>

    </form>

</div>

{% endblock %}
